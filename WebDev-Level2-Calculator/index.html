<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <div class="calc-header">
      <span class="brand">MIKE'S</span>
      <span class="model">CALCUS</span>
    </div>
    <div id="display" class="display">0</div>
    <div class="buttons">
      <button class="btn btn-dark" data-action="clear">AC</button>
      <button class="btn btn-dark" data-action="backspace">⌫</button>
      <button class="btn btn-dark btn-wide" data-action="operator" data-value="/">÷</button>

      <button class="btn btn-light" data-value="7">7</button>
      <button class="btn btn-light" data-value="8">8</button>
      <button class="btn btn-light" data-value="9">9</button>
      <button class="btn btn-orange" data-action="operator" data-value="*">×</button>

      <button class="btn btn-light" data-value="4">4</button>
      <button class="btn btn-light" data-value="5">5</button>
      <button class="btn btn-light" data-value="6">6</button>
      <button class="btn btn-orange" data-action="operator" data-value="-">-</button>

      <button class="btn btn-light" data-value="1">1</button>
      <button class="btn btn-light" data-value="2">2</button>
      <button class="btn btn-light" data-value="3">3</button>
      <button class="btn btn-orange" data-action="operator" data-value="+">+</button>

      <button class="btn btn-light btn-zero" data-value="0">0</button>
      <button class="btn btn-light" data-value=".">.</button>
      <button class="btn btn-green" data-action="calculate">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
